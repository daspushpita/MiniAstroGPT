name: Deploy agentic_pipeline to Hugging Face Space

on:
  push:
    branches: [agentic_pipeline]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout agentic_pipeline
        uses: actions/checkout@v4
        with:
          ref: agentic_pipeline
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "huggingface_hub[hf_xet]>=0.32.0"

      - name: Upload Space files to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: pudas96/AstroGPT
        run: |
          set -euo pipefail

          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN is not set"
            exit 1
          fi

          hf auth login --token "$HF_TOKEN"
          python -c "from huggingface_hub import HfApi; info = HfApi(token='$HF_TOKEN').repo_info(repo_id='$HF_SPACE_REPO', repo_type='space'); print(f'Found Space: {info.id}')"

          python <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = os.environ["HF_SPACE_REPO"]

          api = HfApi(token=token)
          info = api.repo_info(repo_id=repo_id, repo_type="space")
          print(f"Uploading to existing Space: {info.id}")

          api.upload_folder(
              folder_path=".",
              repo_id=repo_id,
              repo_type="space",
              token=token,
              commit_message="Deploy from GitHub agentic_pipeline",
              delete_patterns=["*"],
              ignore_patterns=[
                  ".git/*",
                  ".github/*",
                  ".venv/*",
                  "__pycache__/*",
                  "*.pyc",
                  ".DS_Store",
                  ".env",
                  "logs/*",
              ],
          )
          PY
